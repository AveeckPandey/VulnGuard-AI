AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VulnGuard AI - Serverless Architecture
  FastAPI Lambda (Mangum), Amazon DynamoDB (VulnGuardAssessments), NVIDIA Nemotron 3.5 & Amazon API Gateway HTTP API v2.

Parameters:
  ExistingDynamoDbTableName:
    Type: String
    Default: VulnGuardAssessments
    Description: Name of the existing pre-created DynamoDB table for VulnGuard assessments

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: production
        DEBUG: "false"
        DATABASE_BACKEND: dynamodb
        DYNAMODB_TABLE_NAME: !Ref ExistingDynamoDbTableName
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
        USE_BEDROCK_MOCK: "false"
        NVIDIA_MODEL_ID: nvidia/nemotron-3.5-bolt-e4b
        SSM_NVIDIA_API_KEY_PARAM: /vulnguard/nvidia_api_key
        SSM_NVD_API_KEY_PARAM: /vulnguard/nvd_api_key
        SSM_API_KEY_PARAM: /vulnguard/api_key
        CORS_ORIGINS: '["https://vulnguard-ai.buildwithaveeck.com","https://vulnguard.buildwithaveeck.com","http://localhost:5173","http://127.0.0.1:5173"]'

Resources:
  # ==========================================
  # API Gateway HTTP API (v2)
  # ==========================================
  VulnGuardHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "https://vulnguard-ai.buildwithaveeck.com"
          - "https://vulnguard.buildwithaveeck.com"
          - "http://localhost:5173"
          - "http://127.0.0.1:5173"
        AllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
          - "X-API-Key"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        Authorizers:
          ApiKeyAuthorizer:
            FunctionArn: !GetAtt VulnGuardAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            EnableSimpleResponses: true
            AuthorizerPayloadFormatVersion: "2.0"

  # ==========================================
  # API Gateway Lambda Request Authorizer Function
  # ==========================================
  VulnGuardAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build-lambda
      Handler: backend.api.authorizer.handler
      Timeout: 10
      MemorySize: 256
      Policies:
        - Statement:
            - Sid: SSMParameterStoreAuthorizerAccess
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vulnguard/*"

  # ==========================================
  # Backend FastAPI Lambda Function (Mangum)
  # ==========================================
  VulnGuardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build-lambda
      Handler: backend.app.main.handler
      Policies:
        - Statement:
            - Sid: DynamoDBTableScopedAccess
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:DescribeTable
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingDynamoDbTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingDynamoDbTableName}/index/*"
            - Sid: SSMParameterStoreAccess
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vulnguard/*"
            - Sid: BedrockNovaModelAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0"
      Events:
        ApiAnalyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref VulnGuardHttpApi
            Path: /api/analyze
            Method: POST
            Auth:
              Authorizer: ApiKeyAuthorizer
            RouteSettings:
              ThrottlingBurstLimit: 10
              ThrottlingRateLimit: 5
        ApiAssessments:
          Type: HttpApi
          Properties:
            ApiId: !Ref VulnGuardHttpApi
            Path: /api/assessments
            Method: GET
            Auth:
              Authorizer: ApiKeyAuthorizer
        ApiAssessmentDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref VulnGuardHttpApi
            Path: /api/assessments/{assessment_id}
            Method: GET
            Auth:
              Authorizer: ApiKeyAuthorizer
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref VulnGuardHttpApi
            Path: /{proxy+}
            Method: ANY
        ApiBase:
          Type: HttpApi
          Properties:
            ApiId: !Ref VulnGuardHttpApi
            Path: /
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: "API Gateway HTTP API Endpoint URL"
    Value: !Sub "https://${VulnGuardHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DynamoDBTableName:
    Description: "Name of the existing DynamoDB table"
    Value: !Ref ExistingDynamoDbTableName
  DynamoDBTableArn:
    Description: "ARN of the DynamoDB table"
    Value: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingDynamoDbTableName}"
